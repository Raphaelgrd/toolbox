<!--
name: Boutons à chevron
category: boutons
description: Paire plein / contour à coins de 16 px, chevron qui glisse au survol ; pour les liens secondaires d'une fiche.
style: minimaliste
complexite: simple
variants: plein, contour
-->
<style>
  .pls-chev-row{display:flex;gap:var(--space-2);flex-wrap:wrap}
  .pls-chev{display:inline-flex;align-items:center;gap:6px;padding:10px 14px 10px 16px;border-radius:16px;color:var(--color-text);font:var(--weight-medium) var(--text-base)/1.4 var(--font-body);letter-spacing:-.015em;text-decoration:none;transition:background var(--duration-base) var(--ease-standard)}
  .pls-chev--fill{background:var(--color-border)}
  .pls-chev--outline{box-shadow:inset 0 0 0 1px var(--color-border)}
  .pls-chev:hover{background:color-mix(in srgb,var(--color-text) 8%,transparent)}
  .pls-chev svg{width:14px;height:14px;transition:transform var(--duration-base) var(--ease-standard)}
  .pls-chev:hover svg{transform:translateX(3px)}
</style>

<div class="pls-chev-row">
  <a href="#" class="pls-chev pls-chev--fill">Détails du projet <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m6 4 4 4-4 4"/></svg></a>
  <a href="#" class="pls-chev pls-chev--outline">Site en ligne <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m6 4 4 4-4 4"/></svg></a>
</div>
