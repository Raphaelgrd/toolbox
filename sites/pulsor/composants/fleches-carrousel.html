<!--
name: Flèches de carrousel verticales
category: sliders
description: Deux ronds blancs à ombre très fine, chevrons haut/bas, petit rebond élastique au clic.
style: minimaliste
complexite: simple
-->
<style>
  .pls-arrows{display:grid;gap:var(--space-2)}
  .pls-arrows button{display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:var(--radius-full);background:var(--color-surface);color:var(--color-muted);box-shadow:var(--shadow-sm);cursor:pointer;transition:transform var(--duration-fast) var(--ease-emphasized)}
  .pls-arrows button:hover{color:var(--color-text)}
  .pls-arrows button:active{transform:scale(.9)}
  .pls-arrows svg{width:20px;height:20px}
</style>

<div class="pls-arrows">
  <button aria-label="Précédent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m7 14 5-5 5 5"/></svg></button>
  <button aria-label="Suivant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m7 10 5 5 5-5"/></svg></button>
</div>
