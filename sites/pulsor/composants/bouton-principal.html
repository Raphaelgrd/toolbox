<!--
name: Bouton principal
category: boutons
description: CTA noir en pilule, dégradé sombre et ombre portée vers la gauche ; la flèche sort et revient au survol.
style: minimaliste
complexite: moyenne
-->
<style>
  .pls-btn{position:relative;display:inline-flex;align-items:center;gap:var(--space-2);padding:12px 18px 12px 20px;border-radius:var(--radius-full);background:linear-gradient(220deg,color-mix(in srgb,var(--color-primary) 80%,#fff) 0%,color-mix(in srgb,var(--color-primary) 85%,#000) 100%);color:#fff;font:var(--weight-medium) var(--text-base)/1.4 var(--font-body);letter-spacing:-.015em;text-decoration:none;box-shadow:var(--shadow-md);transition:transform var(--duration-base) var(--ease-standard),box-shadow var(--duration-base) var(--ease-standard)}
  .pls-btn:hover{transform:translateY(-1px)}
  .pls-btn:active{transform:scale(.98)}
  .pls-btn__icon{position:relative;width:16px;height:16px;overflow:hidden}
  .pls-btn__icon svg{position:absolute;inset:0;width:16px;height:16px;transition:transform var(--duration-base) var(--ease-standard)}
  .pls-btn__icon svg+svg{transform:translate(-120%,120%)}
  .pls-btn:hover .pls-btn__icon svg:first-child{transform:translate(120%,-120%)}
  .pls-btn:hover .pls-btn__icon svg+svg{transform:translate(0,0)}
</style>

<a href="#" class="pls-btn">
  Réserver un appel
  <span class="pls-btn__icon" aria-hidden="true">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 11 11 5M6 5h5v5"/></svg>
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 11 11 5M6 5h5v5"/></svg>
  </span>
</a>
