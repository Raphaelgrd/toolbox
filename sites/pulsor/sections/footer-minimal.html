<!--
name: Footer minimal
category: footer
description: Logo seul en haut, puis ligne copyright estompée à gauche et lien légal à droite.
style: minimaliste
complexite: simple
-->
<style>
  .pls-foot{display:grid;gap:var(--space-10);max-width:1200px;margin:0 auto;padding:var(--space-12) var(--space-10) var(--space-10);color:var(--color-text);font:var(--weight-regular) var(--text-sm)/1.4 var(--font-body);letter-spacing:-.015em}
  .pls-foot__logo{display:flex;align-items:center;gap:var(--space-2);font:var(--weight-medium) var(--text-xl)/1 var(--font-body);letter-spacing:-.03em}
  .pls-foot__logo i{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--color-primary)}
  .pls-foot__logo i::before{content:"";width:12px;height:12px;border-radius:50%;border:2.5px solid #fff;border-right-color:transparent}
  .pls-foot__bottom{display:flex;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;color:var(--color-muted)}
  .pls-foot__bottom a{color:color-mix(in srgb,var(--color-text) 50%,transparent);text-decoration:none}
  .pls-foot__bottom a:hover{color:var(--color-text)}
</style>

<footer class="pls-foot">
  <div class="pls-foot__logo"><i></i>Marque</div>
  <div class="pls-foot__bottom"><span>© 2026 Marque. Tous droits réservés.</span><a href="#">Mentions légales</a></div>
</footer>
