<!--
name: En-tête de section avec actions
category: cta
description: Grande phrase PP Mori sur deux lignes à gauche, CTA noir et bouton clair alignés en bas à droite.
style: minimaliste
complexite: simple
components: bouton-principal, bouton-clair
-->
<style>
  .pls-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-6);flex-wrap:wrap;max-width:1200px;margin:0 auto;padding:var(--space-24) var(--space-10) var(--space-16);color:var(--color-text);font-family:var(--font-body)}
  .pls-head h2{max-width:14ch;margin:0;font:var(--weight-bold) clamp(36px,4.6vw,var(--text-4xl))/var(--leading-tight) var(--font-heading);letter-spacing:-.04em}
  .pls-head__ctas{display:flex;gap:var(--space-3);flex-wrap:wrap}
  .pls-head__ctas a{display:inline-flex;align-items:center;gap:var(--space-2);padding:12px 20px;border-radius:var(--radius-full);font:var(--weight-medium) var(--text-base)/1.4 var(--font-body);letter-spacing:-.015em;text-decoration:none}
  .pls-head__ctas a:first-child{background:linear-gradient(220deg,color-mix(in srgb,var(--color-primary) 80%,#fff),color-mix(in srgb,var(--color-primary) 85%,#000));color:#fff;box-shadow:var(--shadow-md)}
  .pls-head__ctas a:last-child{background:color-mix(in srgb,var(--color-border) 60%,var(--color-surface));color:var(--color-text);box-shadow:inset 0 0 12px #fff}
  @media (max-width:640px){.pls-head{padding:var(--space-16) var(--space-5)}}
</style>

<section class="pls-head">
  <h2>Quand un site improvisé ne suffit plus.</h2>
  <div class="pls-head__ctas"><a href="#">Réserver un appel ↗</a><a href="#">Voir tous les projets</a></div>
</section>
